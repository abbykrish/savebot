<!DOCTYPE html>
<html>
  <head>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 320px;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        background: #fff;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .header h1 {
        font-size: 16px;
        font-weight: 700;
      }
      .status {
        font-size: 12px;
        color: #6b7280;
      }
      .page-info {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .page-title {
        font-weight: 600;
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .page-url {
        font-size: 11px;
        color: #9ca3af;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .save-btn {
        background: #2563eb;
        color: white;
      }
      .save-btn:hover { background: #1d4ed8; }
      .save-btn:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      .result {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        text-align: center;
      }
      .result.success { background: #dcfce7; color: #166534; }
      .result.error { background: #fee2e2; color: #991b1b; }
      .result.duplicate { background: #fef3c7; color: #92400e; }
      .auth-section {
        margin-bottom: 12px;
      }
      .auth-section input {
        width: 100%;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .auth-section input:focus {
        outline: none;
        border-color: #2563eb;
      }
      .auth-btn {
        background: #f3f4f6;
        color: #374151;
        font-size: 13px;
        padding: 8px;
      }
      .auth-btn:hover { background: #e5e7eb; }
      .logged-in-as {
        font-size: 12px;
        color: #22c55e;
        margin-bottom: 8px;
      }
      .logout-btn {
        background: none;
        border: none;
        color: #6b7280;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
        width: auto;
        text-decoration: underline;
      }
      .settings {
        margin-top: 12px;
        text-align: center;
      }
      .settings a {
        font-size: 12px;
        color: #6b7280;
        text-decoration: none;
      }
      .settings a:hover { color: #2563eb; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>SaveBot</h1>
      <span class="status" id="status"></span>
    </div>

    <!-- Auth section (shown when not logged in) -->
    <div class="auth-section" id="authSection">
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button class="auth-btn" id="loginBtn">Sign in</button>
    </div>

    <!-- Logged in state -->
    <div id="loggedInSection" style="display:none">
      <div class="logged-in-as" id="loggedInAs"></div>
      <div class="page-info">
        <div class="page-title" id="pageTitle">Loading...</div>
        <div class="page-url" id="pageUrl"></div>
      </div>
      <button class="save-btn" id="saveBtn" disabled>Save this page</button>
      <div style="margin-top:8px;text-align:right">
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div id="result" style="display:none"></div>
    <div class="settings">
      <a href="#" id="dashboardLink">Open Dashboard</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
